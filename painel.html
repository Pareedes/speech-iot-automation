<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Painel de Controle ESP32</title>
</head>
<body>
  <h1>Controle do ESP32</h1>
  <button onclick="enviar('ligar_led1')">Ligar LED 1</button>
  <button onclick="enviar('desligar_led1')">Desligar LED 1</button>
  <button onclick="enviar('ligar_fan1')">Ligar Ventoinha</button>
  <button onclick="enviar('desligar_fan1')">Desligar Ventoinha</button>

  <script>
    const espIp = "http://192.168.4.1"; // IP do ESP32 (modo AP)
    async function enviar(cmd) {
      const url = `${espIp}/acao?cmd=${cmd}`;
      try {
        const r = await fetch(url);
        const txt = await r.text();
        alert(txt);
      } catch (e) {
        alert("Falha ao enviar comando: " + e);
      }
    }
  </script>
</body>
</html>
